<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Deep Space Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="50%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#070c1a" />
    </linearGradient>

    <linearGradient id="neon-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4" />
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.6); opacity: 1; }
    }
    @keyframes pulse-ring {
      0% { r: 4px; opacity: 0.9; }
      100% { r: 18px; opacity: 0; }
    }
    @keyframes scan-horizontal {
      0% { transform: translateX(-900px); }
      100% { transform: translateX(900px); }
    }
    @keyframes dash-flow {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes text-glow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 22px rgba(168, 85, 247, 0.7)); }
    }
    @keyframes float-chip {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .node-anim-1 { animation: pulse-node 3s infinite ease-in-out; transform-origin: 100px 70px; }
    .node-anim-2 { animation: pulse-node 2.4s infinite ease-in-out 0.6s; transform-origin: 220px 140px; }
    .node-anim-3 { animation: pulse-node 3.2s infinite ease-in-out 1.2s; transform-origin: 150px 190px; }
    .node-anim-4 { animation: pulse-node 2.8s infinite ease-in-out 0.3s; transform-origin: 780px 60px; }
    .node-anim-5 { animation: pulse-node 3.5s infinite ease-in-out 0.9s; transform-origin: 820px 170px; }
    .node-anim-6 { animation: pulse-node 2.6s infinite ease-in-out 1.5s; transform-origin: 700px 130px; }
    .ring-pulse-1 { animation: pulse-ring 2.5s infinite cubic-bezier(0.2, 0.8, 0.2, 1); }
    .ring-pulse-2 { animation: pulse-ring 2.5s infinite cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s; }
    .synapse-line { stroke-dasharray: 6 8; animation: dash-flow 4s linear infinite; }
    .scan-beam { animation: scan-horizontal 5s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .title-glow { animation: text-glow 4s infinite ease-in-out; }
    .chip-1 { animation: float-chip 3s infinite ease-in-out; }
    .chip-2 { animation: float-chip 3.4s infinite ease-in-out 0.5s; }
    .chip-3 { animation: float-chip 2.8s infinite ease-in-out 1s; }
    .chip-4 { animation: float-chip 3.2s infinite ease-in-out 1.5s; }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="240" rx="16" fill="url(#bg-grad)" />
  <rect width="898" height="238" x="1" y="1" rx="15" fill="none" stroke="url(#card-border)" stroke-width="1.5" />

  <!-- Neural Mesh Grid / Hexagonal Ambient Geometry -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75" fill="none">
    <path d="M 0 40 L 900 40 M 0 100 L 900 100 M 0 160 L 900 160 M 0 220 L 900 220" />
    <path d="M 120 0 L 120 240 M 280 0 L 280 240 M 450 0 L 450 240 M 620 0 L 620 240 M 780 0 L 780 240" />
  </g>

  <!-- Synaptic Neural Connections (Left Cluster) -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.45" class="synapse-line">
    <line x1="100" y1="70" x2="220" y2="140" />
    <line x1="100" y1="70" x2="150" y2="190" />
    <line x1="220" y1="140" x2="150" y2="190" />
    <line x1="220" y1="140" x2="310" y2="110" />
    <line x1="150" y1="190" x2="50" y2="210" />
  </g>

  <!-- Synaptic Neural Connections (Right Cluster) -->
  <g stroke="#c084fc" stroke-width="1.2" opacity="0.45" class="synapse-line">
    <line x1="780" y1="60" x2="700" y2="130" />
    <line x1="780" y1="60" x2="820" y2="170" />
    <line x1="700" y1="130" x2="820" y2="170" />
    <line x1="700" y1="130" x2="590" y2="110" />
    <line x1="820" y1="170" x2="870" y2="200" />
  </g>

  <!-- Neural Nodes with Animated Radii -->
  <!-- Left Nodes -->
  <circle cx="100" cy="70" r="8" fill="#38bdf8" opacity="0.3" class="ring-pulse-1" />
  <circle cx="100" cy="70" r="4.5" fill="#38bdf8" class="node-anim-1" filter="url(#soft-glow)" />

  <circle cx="220" cy="140" r="8" fill="#818cf8" opacity="0.3" class="ring-pulse-2" />
  <circle cx="220" cy="140" r="5" fill="#818cf8" class="node-anim-2" filter="url(#soft-glow)" />

  <circle cx="150" cy="190" r="3.5" fill="#38bdf8" class="node-anim-3" />
  <circle cx="310" cy="110" r="3" fill="#38bdf8" opacity="0.6" />
  <circle cx="50" cy="210" r="2.5" fill="#38bdf8" opacity="0.5" />

  <!-- Right Nodes -->
  <circle cx="780" cy="60" r="8" fill="#c084fc" opacity="0.3" class="ring-pulse-1" />
  <circle cx="780" cy="60" r="4.5" fill="#c084fc" class="node-anim-4" filter="url(#soft-glow)" />

  <circle cx="820" cy="170" r="8" fill="#818cf8" opacity="0.3" class="ring-pulse-2" />
  <circle cx="820" cy="170" r="5" fill="#818cf8" class="node-anim-5" filter="url(#soft-glow)" />

  <circle cx="700" cy="130" r="4" fill="#c084fc" class="node-anim-6" />
  <circle cx="590" cy="110" r="3" fill="#818cf8" opacity="0.6" />
  <circle cx="870" cy="200" r="2.5" fill="#c084fc" opacity="0.5" />

  <!-- Scanning Light Beam Across Header -->
  <g opacity="0.4" class="scan-beam">
    <rect x="0" y="0" width="180" height="240" fill="url(#glow-beam)" />
  </g>

  <!-- Status Chip (Top-Center) -->
  <g transform="translate(325, 26)">
    <rect width="250" height="26" rx="13" fill="#0c1630" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
    <circle cx="16" cy="13" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" fill="#38bdf8" font-family="'Fira Code', 'Courier New', monospace" font-size="10.5" font-weight="600" letter-spacing="1.5">AI &amp; DATA PIPELINE // ACTIVE</text>
  </g>

  <!-- Main Headline Title -->
  <text x="450" y="98" text-anchor="middle" fill="url(#neon-cyan-purple)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="1" class="title-glow">BADIPATI ANIL KUMAR</text>

  <!-- Subtitle with Terminal Style -->
  <text x="450" y="132" text-anchor="middle" fill="#e2e8f0" font-family="'Fira Code', 'Courier New', monospace" font-size="13.5" font-weight="500" letter-spacing="2">SOFTWARE ENGINEER  ·  SQL &amp; PYTHON DEVELOPER  ·  DATA ANALYST</text>

  <!-- Core Capability Pills (Bottom Center) -->
  <g transform="translate(145, 168)">
    <!-- Pill 1: Python Data -->
    <g class="chip-1" transform="translate(0, 0)">
      <rect width="138" height="32" rx="7" fill="#0d1938" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <circle cx="16" cy="16" r="3.5" fill="#38bdf8" />
      <text x="28" y="20.5" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Python · Pandas</text>
    </g>

    <!-- Pill 2: SQL Architecture -->
    <g class="chip-2" transform="translate(155, 0)">
      <rect width="144" height="32" rx="7" fill="#0d1938" stroke="#818cf8" stroke-width="1" opacity="0.9" />
      <circle cx="16" cy="16" r="3.5" fill="#818cf8" />
      <text x="28" y="20.5" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">SQL · Relational DB</text>
    </g>

    <!-- Pill 3: Power BI -->
    <g class="chip-3" transform="translate(315, 0)">
      <rect width="138" height="32" rx="7" fill="#0d1938" stroke="#f59e0b" stroke-width="1" opacity="0.9" />
      <circle cx="16" cy="16" r="3.5" fill="#f59e0b" />
      <text x="28" y="20.5" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Power BI · DAX</text>
    </g>

    <!-- Pill 4: watsonx AI -->
    <g class="chip-4" transform="translate(470, 0)">
      <rect width="142" height="32" rx="7" fill="#0d1938" stroke="#c084fc" stroke-width="1" opacity="0.9" />
      <circle cx="16" cy="16" r="3.5" fill="#c084fc" />
      <text x="28" y="20.5" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">watsonx Assistant</text>
    </g>
  </g>

  <!-- Bottom Accent Border Glow Line -->
  <line x1="60" y1="239" x2="840" y2="239" stroke="url(#neon-cyan-purple)" stroke-width="2" opacity="0.8" />
</svg>
