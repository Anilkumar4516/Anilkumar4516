<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#04070f" />
    </linearGradient>

    <linearGradient id="neon-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <style>
    @keyframes line-glow {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes radar-sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes data-stream {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.4); opacity: 1; }
    }
    .radar-arm { transform-origin: 75px 145px; animation: radar-sweep 4s linear infinite; }
    .data-flow { stroke-dasharray: 4 6; animation: data-stream 2.5s linear infinite; }
    .dot-pulse { animation: pulse-dot 2s infinite ease-in-out; transform-origin: 75px 145px; }
  </style>

  <!-- Terminal Window Background -->
  <rect width="900" height="280" rx="14" fill="url(#term-bg)" />
  <rect width="898" height="278" x="1" y="1" rx="13" fill="none" stroke="url(#neon-border)" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect width="900" height="38" rx="14" fill="#0d1424" />
  <rect width="900" height="1" y="38" fill="rgba(255,255,255,0.08)" />

  <!-- Window Control Buttons -->
  <circle cx="24" cy="19" r="6" fill="#ef4444" />
  <circle cx="44" cy="19" r="6" fill="#f59e0b" />
  <circle cx="64" cy="19" r="6" fill="#10b981" />

  <!-- Header Title -->
  <text x="450" y="24" text-anchor="middle" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" letter-spacing="1">
    SYSTEM-KERNEL // NEURAL-PIPELINE-METRICS.SH
  </text>
  <text x="860" y="24" text-anchor="end" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">
    STATUS: ONLINE
  </text>

  <!-- Left Side: Interactive Radar & Synaptic Core -->
  <g transform="translate(45, 15)">
    <!-- Radar Base Circles -->
    <circle cx="75" cy="130" r="65" fill="#0a1226" stroke="#38bdf8" stroke-width="1" opacity="0.3" />
    <circle cx="75" cy="130" r="44" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.4" />
    <circle cx="75" cy="130" r="22" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.5" />

    <!-- Crosshairs -->
    <line x1="10" y1="130" x2="140" y2="130" stroke="#38bdf8" stroke-width="0.75" opacity="0.35" />
    <line x1="75" y1="65" x2="75" y2="195" stroke="#38bdf8" stroke-width="0.75" opacity="0.35" />

    <!-- Sweeping Radar Beam -->
    <g class="radar-arm">
      <path d="M 75 130 L 140 130 A 65 65 0 0 0 120 85 Z" fill="url(#cyan-glow)" opacity="0.3" />
      <line x1="75" y1="130" x2="140" y2="130" stroke="#38bdf8" stroke-width="1.8" />
    </g>

    <!-- Center Pulse Core -->
    <circle cx="75" cy="130" r="4" fill="#38bdf8" class="dot-pulse" />
    <text x="75" y="215" text-anchor="middle" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10" letter-spacing="1">NEURAL HUB</text>
  </g>

  <!-- Right Side: Live Architecture Pipelines -->
  <g transform="translate(230, 60)">
    <!-- Pipeline 1: Python ETL -->
    <g transform="translate(0, 0)">
      <rect width="620" height="34" rx="6" fill="#0b1326" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#38bdf8" />
      <text x="32" y="21" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">[DATA INGESTION]</text>
      <text x="175" y="21" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">Python ETL, Pandas Cleaning, Exploratory Analysis &amp; NumPy Arrays</text>
    </g>

    <!-- Pipeline 2: Relational Architecture -->
    <g transform="translate(0, 42)">
      <rect width="620" height="34" rx="6" fill="#0b1326" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#818cf8" />
      <text x="32" y="21" fill="#818cf8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">[SQL ENGINE]</text>
      <text x="175" y="21" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">MySQL Schema Design, Complex Joins, Window Aggregations &amp; Indexes</text>
    </g>

    <!-- Pipeline 3: Business Intelligence -->
    <g transform="translate(0, 84)">
      <rect width="620" height="34" rx="6" fill="#0b1326" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#f59e0b" />
      <text x="32" y="21" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="11" font-weight="600">[BI ANALYTICS]</text>
      <text x="175" y="21" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">Power BI Semantic Models, DAX Calculation Measures &amp; Executive Dashboards</text>
    </g>

    <!-- Pipeline 4: Cryptography & Ledger -->
    <g transform="translate(0, 126)">
      <rect width="620" height="34" rx="6" fill="#0b1326" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#10b981" />
      <text x="32" y="21" fill="#10b981" font-family="'Fira Code', monospace" font-size="11" font-weight="600">[AUDIT LEDGER]</text>
      <text x="175" y="21" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">RFC 6962 Binary Merkle Trees, O(log N) Proofs &amp; Zero-Knowledge Decoupling</text>
    </g>

    <!-- Pipeline 5: Conversational AI -->
    <g transform="translate(0, 168)">
      <rect width="620" height="34" rx="6" fill="#0b1326" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#c084fc" />
      <text x="32" y="21" fill="#c084fc" font-family="'Fira Code', monospace" font-size="11" font-weight="600">[AI CHATBOT]</text>
      <text x="175" y="21" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">IBM watsonx Assistant Integrations, Contextual Dialog Trees &amp; Web Embeds</text>
    </g>
  </g>
</svg>
